<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --accent:#16765b; --danger:#b42318; --warn:#b54708; --muted:#667085; }
    * { box-sizing:border-box; }
    body { margin:0; background:transparent; color:CanvasText; }
    .shell { padding:16px; max-width:1080px; margin:auto; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
    h1 { font-size:20px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:12px; }
    button { border:1px solid color-mix(in srgb, CanvasText 18%, transparent); background:Canvas; color:CanvasText; border-radius:9px; padding:8px 11px; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    .metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-bottom:14px; }
    .metric, .card, .empty { border:1px solid color-mix(in srgb, CanvasText 13%, transparent); border-radius:12px; background:color-mix(in srgb, Canvas 96%, var(--accent) 4%); }
    .metric { padding:11px; }
    .metric strong { font-size:22px; display:block; }
    .metric span { color:var(--muted); font-size:12px; }
    .columns { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    section h2 { font-size:14px; margin:0 0 8px; }
    .stack { display:grid; gap:8px; }
    .card { padding:11px; }
    .row { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .title { font-weight:650; font-size:14px; }
    .reason { margin-top:5px; color:var(--muted); font-size:12px; line-height:1.45; white-space:pre-wrap; }
    .badge { flex:none; border-radius:999px; padding:3px 7px; font-size:11px; background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); }
    .badge.p0 { color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, transparent); }
    .badge.p1 { color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); }
    .empty { padding:18px; color:var(--muted); text-align:center; font-size:13px; }
    .actions { display:flex; gap:7px; margin-top:9px; }
    .actions button { padding:5px 8px; font-size:12px; }
    @media (max-width:760px) { .metrics{grid-template-columns:repeat(2,1fr)} .columns{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="shell">
    <header><div><h1>LightLink AI 外贸运营驾驶舱</h1><div class="sub" id="stamp">等待Odoo数据</div></div><button id="refresh">刷新</button></header>
    <div class="metrics" id="metrics"></div>
    <div class="columns">
      <section><h2>必须处理</h2><div class="stack" id="blockers"></div></section>
      <section><h2>增长机会</h2><div class="stack" id="opportunities"></div></section>
      <section><h2>待人工批准</h2><div class="stack" id="approvals"></div></section>
      <section><h2>使用方式</h2><div class="card"><div class="reason">直接在对话中说：分析产品上市条件、找出优先客户、复盘经营效果，或准备一项Odoo行动。所有写操作都会先显示预览并等待确认。</div></div></section>
    </div>
  </div>
  <script>
    const pending = new Map(); let nextId = 1; let snapshot = {};
    const text = value => String(value ?? "");
    const safe = value => text(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    function safeUrl(value){ try { const url=new URL(text(value)); return ["http:","https:"].includes(url.protocol)?url.href:""; } catch { return ""; } }
    function request(method, params) { const id=nextId++; parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); return new Promise((resolve,reject)=>pending.set(id,{resolve,reject})); }
    function empty(text){ return `<div class="empty">${safe(text)}</div>`; }
    function card(item, kind){ const priority=text(item.priority||""); const priorityClass=/^p[0-3]$/i.test(priority)?priority.toLowerCase():""; const evidence=safeUrl(item.evidence?.[0]?.url); return `<article class="card"><div class="row"><div class="title">${safe(item.title)}</div><span class="badge ${priorityClass}">${safe(priority||kind)}</span></div><div class="reason">${safe(item.reason||item.project||"")}</div><div class="actions">${evidence?`<button data-url="${safe(evidence)}">查看Odoo依据</button>`:""}<button data-follow="${safe(item.id||item.title)}">在对话中处理</button></div></article>`; }
    function render(data){ snapshot=data||{}; const s=snapshot.summary||{}; document.querySelector("#stamp").textContent=`${text(snapshot.generated_at||"")} · ${text(snapshot.project_count||0)}个项目`; const metrics=[["产品阻塞",s.blocked_products],["发布异常",s.failed_publications],["账号环境",s.unhealthy_accounts],["逾期客户",s.overdue_leads],["有效机会",s.active_opportunities],["待批准",s.waiting_approvals]]; document.querySelector("#metrics").innerHTML=metrics.map(([k,v])=>`<div class="metric"><strong>${safe(v||0)}</strong><span>${k}</span></div>`).join(""); document.querySelector("#blockers").innerHTML=(snapshot.blockers||[]).map(x=>card(x,x.kind)).join("")||empty("当前没有阻塞事项"); document.querySelector("#opportunities").innerHTML=(snapshot.opportunities||[]).map(x=>card(x,"机会")).join("")||empty("当前没有高优先级机会"); document.querySelector("#approvals").innerHTML=(snapshot.waiting_approvals||[]).map(x=>card(x,"待批准")).join("")||empty("当前没有待批准行动"); }
    addEventListener("message",event=>{ if(event.source!==parent||event.data?.jsonrpc!=="2.0")return; const m=event.data; if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;} if(m.method==="ui/notifications/tool-result")render(m.params?.structuredContent); },{passive:true});
    addEventListener("click",async event=>{ const button=event.target.closest("button"); if(!button)return; if(button.dataset.url){ const url=safeUrl(button.dataset.url); if(url){ if(window.openai?.openExternal) await window.openai.openExternal({href:url}); else window.open(url,"_blank","noopener,noreferrer"); } } if(button.dataset.follow){ await request("ui/message",{role:"user",content:[{type:"text",text:`请处理驾驶舱中的行动或事项：${button.dataset.follow}。先读取依据；如需写入Odoo，请先准备行动预览，等待我确认。`}]}).catch(()=>{}); } });
    document.querySelector("#refresh").onclick=async()=>{ const result=await request("tools/call",{name:"get_daily_operations_snapshot",arguments:{}}).catch(()=>null); if(result?.structuredContent)render(result.structuredContent); };
    render(window.openai?.toolOutput||{});
  </script>
</body>
</html>
